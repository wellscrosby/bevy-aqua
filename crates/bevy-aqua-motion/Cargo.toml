[package]
name = "bevy-aqua-motion"
description = "Motion-vector integration for Aqua's animated wave surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy-aqua-core.workspace = true
bevy-aqua-waves.workspace = true
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
] }

[dev-dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_render",
    "bevy_sprite_render",
    "bevy_window",
    "multi_threaded",
] }

[package.metadata.docs.rs]
cargo-args = ["-j", "1"]

[lints]
workspace = true
